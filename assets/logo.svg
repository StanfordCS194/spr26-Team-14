<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Eye icon -->
  <g transform="translate(12, 12)">
    <!-- Outer eye shape -->
    <path d="M38 38 Q10 38 0 38 Q10 12 38 4 Q66 12 76 38 Q66 64 38 72 Q10 64 0 38 Z"
          fill="none" stroke="url(#grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Concentric rings (Inception-style layers) -->
    <circle cx="38" cy="38" r="24" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.7"/>
    <circle cx="38" cy="38" r="17" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.8"/>
    <circle cx="38" cy="38" r="10" fill="url(#iris)" opacity="0.9"/>
    <!-- Pupil -->
    <circle cx="38" cy="38" r="4.5" fill="#0F172A"/>
    <!-- Light reflection -->
    <circle cx="33" cy="33" r="2.5" fill="white" opacity="0.8"/>
  </g>

</svg>
